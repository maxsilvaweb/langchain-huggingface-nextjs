name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  PROJECT_ID: rag-chat-app-2026
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/rag-chat-app-2026/rag-chat

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api (Python)
        uses: docker/build-push-action@v6
        with:
          context: ./python-service
          file: ./python-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy rag-chat-web \
            --image ${{ env.REGISTRY }}/web:latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --quiet

      - name: Deploy api to Cloud Run
        run: |
          gcloud run deploy rag-chat-api \
            --image ${{ env.REGISTRY }}/api:latest \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --port 8080 \
            --quiet

      - name: Show deployment URLs
        run: |
          echo "Web: $(gcloud run services describe rag-chat-web --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format 'value(status.url)')"
          echo "API: $(gcloud run services describe rag-chat-api --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format 'value(status.url)')"
